version: "3.8"

services:
  db:
    image: mcr.microsoft.com/azure-sql-edge:latest
    environment:
      SA_PASSWORD: "Your_password123"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    healthcheck:
        test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/1433 && exec 3>&-'"]
        interval: 5s
        timeout: 5s
        retries: 30

  migrations:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    depends_on:
      db:
        condition: service_healthy
    # Bind-mount the repository into the container so the migration script
    # and projects are available to the SDK image.
    volumes:
      - ./:/src:cached 
    working_dir: /src
    entrypoint: ["/bin/bash", "-c", "/src/scripts/run-migrations.sh \"Server=db;Database=BuilderAssistantDb;User Id=sa;Password=Your_password123;TrustServerCertificate=True;\""]

  api:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: build
    depends_on:
      - db
      - migrations
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=BuilderAssistantDb;User Id=sa;Password=Your_password123;TrustServerCertificate=True;
      - Groq__ApiKey=${Groq__ApiKey}
    ports:
      - "5001:8080"
      - "5002:8081"
    # In dev we bind-mount the repo so code changes are picked up by `dotnet run`.
    volumes:
      # CRITICAL: Changed /workspace to /src to match your Dockerfile WORKDIR
      - ./:/src:cached 
      - /src/src/Api/bin
      - /src/src/Api/obj
    working_dir: /src          # Matches your Dockerfile WORKDIR
    command: ["dotnet", "run", "--project", "src/Api"]

